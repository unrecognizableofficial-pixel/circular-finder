databases:
  - name: circular-finder-db
    databaseName: circular_finder
    user: circular_finder

services:
  - type: web
    name: circular-finder-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: circular-finder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: "18"
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: circular-finder-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: BACKEND_ORIGIN
        fromService:
          type: web
          name: circular-finder-api
          property: hostport
